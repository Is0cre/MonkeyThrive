<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{safetyPageTitle}}</title>
  <meta name="description" content="{{safetyPageDescription}}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#0D1117">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
{{alternates}}
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --line: #1c2430;
      --text: #e6edf3;
      --muted: #8b949e;
      --amber: #e8a645;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.6;
    }

    .wrap {
      width: min(680px, calc(100% - 40px));
      margin: 0 auto;
      padding: 40px 0 64px;
    }

    a { color: var(--amber); text-underline-offset: 3px; }

    a:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 3px;
    }

    .mark {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin-bottom: 20px;
      box-shadow: 0 0 0 1px rgba(232, 166, 69, 0.35);
    }

    .langs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin: 0 0 18px;
    }

    .langs a[aria-current="page"] { color: var(--text); text-decoration: none; }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 560;
      letter-spacing: -0.03em;
    }

    .lead {
      margin: 0 0 28px;
      color: var(--muted);
    }

    h2 {
      margin: 28px 0 8px;
      font-size: 18px;
      font-weight: 640;
    }

    p { margin: 0 0 12px; }

    .note {
      margin-top: 28px;
      padding: 16px;
      background: #1a140c;
      border: 1px solid rgba(232, 166, 69, 0.55);
      border-radius: 14px;
    }

    footer {
      margin-top: 36px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    footer nav { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="mark" src="/emblem.png" width="72" height="72" alt="">
    {{langSwitch}}
    <h1>{{safetyHeading}}</h1>
    <p class="lead">{{safetyLead}}</p>

    <h2>{{safetyWhatH}}</h2>
    <p>{{safetyWhat}}</p>

    <h2>{{safetyWotH}}</h2>
    <p>{{safetyWot1}}</p>
    <p>{{safetyWot2}}</p>

    <h2>{{safetyWontH}}</h2>
    <p>{{safetyWont}}</p>

    <div class="note">
      <p>{{safetyNote}}</p>
    </div>

    <footer>
      <nav aria-label="{{navProject}}">
        <a href="index.html">{{brand}}</a>
        <a href="https://github.com/Is0cre/MonkeyThrive" rel="noreferrer">{{footerGithub}}</a>
        <a href="https://github.com/Is0cre/MonkeyThrive/blob/main/LICENSE" rel="noreferrer">{{footerLicense}}</a>
      </nav>
    </footer>
  </div>
</body>
</html>

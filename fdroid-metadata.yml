Categories:
  - Sports & Health
License: GPL-3.0-only
AuthorName: Is0cre
AuthorWebSite: https://monkeythrive.app
WebSite: https://monkeythrive.app
SourceCode: https://github.com/Is0cre/MonkeyThrive
IssueTracker: https://github.com/Is0cre/MonkeyThrive/issues
Changelog: https://github.com/Is0cre/MonkeyThrive/releases

AutoName: MonkeyThrive

RepoType: git
Repo: https://github.com/Is0cre/MonkeyThrive.git

Builds:
  - versionName: 0.1.2
    versionCode: 3
    commit: v0.1.2
    timeout: 3600
    subdir: thrives_app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.4
    rm:
      - thrives_app/web
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache && $$flutter$$/bin/flutter config --no-analytics
      - export PUB_CACHE=$(pwd)/.pub-cache && $$flutter$$/bin/flutter pub get
    scandelete:
      - thrives_app/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache && $$flutter$$/bin/flutter config --no-analytics
      - export PUB_CACHE=$(pwd)/.pub-cache && $$flutter$$/bin/flutter pub get
      - export PUB_CACHE=$(pwd)/.pub-cache && $$flutter$$/bin/flutter build apk --release
    ndk: r28c

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
UpdateCheckData: thrives_app/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.1.2
CurrentVersionCode: 3

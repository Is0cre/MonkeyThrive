name: Deploy MonkeyThrive PWA to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'thrives_app/**'
      - 'web_landing/**'
      - '.github/workflows/deploy_pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd thrives_app
          flutter pub get

      - name: Build Web PWA (Offline & Local Bundled Assets)
        run: |
          cd thrives_app
          flutter build web --release --no-web-resources-cdn --base-href "/app/"

      - name: Assemble landing page at / and PWA at /app
        run: |
          rm -rf publish
          mkdir -p publish/app
          cp -a thrives_app/build/web/. publish/app/
          cp web_landing/index.html web_landing/safety.html web_landing/emblem.png web_landing/robots.txt web_landing/sitemap.xml publish/
          cp web_landing/flutter_service_worker.js publish/flutter_service_worker.js
          echo "monkeythrive.app" > publish/CNAME
          touch publish/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: publish
          branch: gh-pages
          clean: true

publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.42
  shared_preferences: ^2.3.3
  crypto: ^3.0.7
  vibration: ^2.0.0
  wakelock_plus: ^1.2.10
  camera: ^0.11.2
  path_provider: ^2.1.5
  encrypt: ^5.0.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/

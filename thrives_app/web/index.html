<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MonkeyThrive — Offline nervous system regulation and grounding tools.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D1117">

  <!-- No external fonts, no CDN, no tracking pixels. Everything self-hosted. -->

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MonkeyThrive">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MonkeyThrive</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent flash of white background before Flutter renders */
    html, body {
      background-color: #0D1117;
      margin: 0;
      padding: 0;
      height: 100%;
    }

    /* Full figure, including the tail, until Flutter draws. */
    #opening {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0D1117;
      pointer-events: none;
    }

    #opening img {
      width: auto;
      height: auto;
      max-width: min(440px, 88vw);
      max-height: 82vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div id="opening">
    <img src="monkey_king.png" alt="Sun Wukong in red and gold, holding a phone.">
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var opening = document.getElementById('opening');
      if (opening) opening.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
